name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  authoring-quality:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/authoring-checks.yml
  preview:
    needs: authoring-quality
    if: always() && (github.event.action == 'closed' || needs.authoring-quality.result == 'success')
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm install

      - name: Build tokens
        if: github.event.action != 'closed'
        run: npm run tokens:build

      - name: Build Storybook
        if: github.event.action != 'closed'
        run: npm run storybook:build
        env:
          STORYBOOK_BASE_PATH: /consonant/pr-preview/pr-${{ github.event.pull_request.number }}/

      - name: Build and stage S2A Studio
        if: github.event.action != 'closed'
        run: npx nx run authoring-poc:stage-pages

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: storybook-static
