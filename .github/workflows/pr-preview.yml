name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm install

      - name: Build tokens
        if: github.event.action != 'closed'
        run: npm run tokens:build

      - name: Build Storybook
        if: github.event.action != 'closed'
        run: npm run storybook:build
        env:
          STORYBOOK_BASE_PATH: /consonant/pr-preview/pr-${{ github.event.pull_request.number }}/

      - name: Install prototyping dependencies
        if: github.event.action != 'closed'
        run: cd apps/prototyping && npm ci

      - name: Build prototypes
        if: github.event.action != 'closed'
        run: cd apps/prototyping && npm run build

      - name: Copy prototypes into build
        if: github.event.action != 'closed'
        run: cp -r apps/prototyping/dist storybook-static/prototyping

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: storybook-static

      - name: Compute prototype preview URL
        if: github.event.action != 'closed' && startsWith(github.head_ref, 'proto/')
        id: proto-url
        run: |
          SLUG="${{ github.head_ref }}"
          SLUG="${SLUG#proto/}"
          echo "url=https://adobecom.github.io/consonant/pr-preview/pr-${{ github.event.pull_request.number }}/prototyping/${SLUG}/" >> $GITHUB_OUTPUT

      - name: Post prototype preview link
        if: github.event.action != 'closed' && startsWith(github.head_ref, 'proto/')
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: prototype-preview
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            🎨 **Prototype preview:** ${{ steps.proto-url.outputs.url }}
