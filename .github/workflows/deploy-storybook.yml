name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  authoring-quality:
    uses: ./.github/workflows/authoring-checks.yml
  deploy:
    needs: authoring-quality
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build tokens
        run: npm run tokens:build

      - name: Build Storybook
        run: npm run storybook:build

      - name: Build and stage S2A Studio
        run: npx nx run authoring-poc:stage-pages

      - name: Disable Jekyll (allow _-prefixed assets to be served)
        run: touch storybook-static/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: storybook-static
          clean-exclude: pr-preview
