name = "s2a-request-intake"
main = "src/index.ts"
compatibility_date = "2025-07-01"

# Images are stored in Workers KV (free tier, no payment method) with a TTL, and
# served back via GET /asset/<key>. Namespace created with:
#   wrangler kv namespace create INTAKE_KV
[[kv_namespaces]]
binding = "INTAKE_KV"
id = "8ad4542426ab44e4970978c3b2c7a67e"

[vars]
GH_REPO = "adobecom/consonant"

# Secrets (never commit these) — set with:
#   wrangler secret put GH_TOKEN        # PAT with Issues: read/write on GH_REPO
#   wrangler secret put INTAKE_SECRET   # optional shared secret the plugin sends
