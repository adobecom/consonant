name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Diagnose d3 install
        run: |
          echo "=== npm version ===" && npm --version
          echo "=== find d3 anywhere in node_modules ===" && find node_modules -name "package.json" -path "*/d3/package.json" 2>/dev/null | head -5 || echo "d3 package.json not found anywhere"
          echo "=== find d3-selection anywhere ===" && find node_modules -name "package.json" -path "*/d3-selection/package.json" 2>/dev/null | head -5 || echo "d3-selection not found anywhere"
          echo "=== root node_modules count ===" && ls node_modules | wc -l

      - name: Build tokens
        run: npm run tokens:build

      - name: Build Storybook
        run: npm run storybook:build

      - name: Copy prototypes into build
        run: cp -r apps/prototyping storybook-static/prototyping

      - name: Disable Jekyll (allow _-prefixed assets to be served)
        run: touch storybook-static/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: storybook-static
          clean-exclude: pr-preview
