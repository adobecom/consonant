name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  authoring-quality:
    uses: ./.github/workflows/authoring-checks.yml
  deploy:
    needs: authoring-quality
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: true
      # The site root is the landing page (apps/site); Storybook moved one folder down.
      STORYBOOK_BASE_PATH: /consonant/storybook/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build tokens
        run: npm run tokens:build

      - name: Build Storybook
        run: npm run storybook:build

      - name: Build Contract Book (read-only snapshot)
        run: npm run contract-book:build

      - name: Build S2A Studio
        run: npx nx run authoring-poc:build

      - name: Stage the site (landing page + storybook/ + contract-book/ + authoring/)
        run: node scripts/stage-site.mjs

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          clean-exclude: pr-preview
